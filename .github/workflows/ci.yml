name: Godot prototype validation
on: [push, pull_request]
jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Gameplay rule tests
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/test_combat.gd
      - name: Scene startup smoke test
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 5
